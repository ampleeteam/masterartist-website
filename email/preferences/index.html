<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Email preferences — Master Artist</title>
<link rel="icon" href="/logo.svg">
<style>
  body{font-family:system-ui,sans-serif;background:#F6F1E8;color:#2A1740;margin:0;padding:32px 16px}
  main{max-width:460px;margin:0 auto;background:#fff;border:1px solid rgba(59,28,90,.16);padding:28px}
  h1{font-weight:500;font-size:28px;margin:0 0 8px}
  p{line-height:1.5}
  button{background:#E6B44C;color:#2A1240;border:0;padding:12px 18px;cursor:pointer;font:inherit}
  .err{color:#7a3116}
</style>
</head>
<body>
<main>
  <h1>Email preferences</h1>
  <p id="lead">Loading…</p>
  <p id="msg"></p>
  <p><button id="off" type="button" hidden>Stop workshop news by email</button></p>
  <p><button id="on" type="button" hidden>Send me workshop news again</button></p>
  <p style="font-size:13px;color:#6E6180">Master Artist, 38-2, Jalan 28/70A, Desa Sri Hartamas, 50480 Kuala Lumpur. This page only changes email news. It does not show your messages.</p>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.58.0';
const sb = createClient(
  'https://fudaosneozobacdalncv.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1ZGFvc25lb3pvYmFjZGFsbmN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTIwNDUsImV4cCI6MjEwMjQ2ODA0NX0.0PKbkncE8goPg-iJlAUacNUa3MjWJSj1ZLeqTpkqPZ0'
);
const token = new URLSearchParams(location.search).get('token');
const lead = document.getElementById('lead');
const msg = document.getElementById('msg');
const off = document.getElementById('off');
const on = document.getElementById('on');
function show(j) {
  if (!j || !j.ok) { lead.textContent = 'This link is not valid.'; return; }
  lead.textContent = j.unsubscribed || !j.email_consent
    ? 'You are not on the workshop news list.'
    : 'You are on the workshop news list.';
  off.hidden = !!(j.unsubscribed || !j.email_consent);
  on.hidden = !(j.unsubscribed || !j.email_consent);
}
if (!token) show(null);
else {
  const { data, error } = await sb.rpc('email_preferences', { p_token: token, p_action: 'status', p_on: null });
  if (error) { lead.textContent = 'Preferences are not available yet.'; msg.textContent = ''; }
  else show(data);
}
off.addEventListener('click', async () => {
  const { data, error } = await sb.rpc('email_preferences', { p_token: token, p_action: 'unsubscribe', p_on: false });
  if (error) msg.textContent = 'Could not save.';
  else { msg.textContent = 'Saved.'; show(data); }
});
on.addEventListener('click', async () => {
  const { data, error } = await sb.rpc('email_preferences', { p_token: token, p_action: 'save', p_on: true });
  if (error) msg.textContent = 'Could not save.';
  else { msg.textContent = 'Saved.'; show(data); }
});
</script>
</body>
</html>
