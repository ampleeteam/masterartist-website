# Fetches Sabrina's workshop schedule and rebuilds the dated pages.
# No credential is stored in the repo. The job reads a public CSV.
#
# Access, one of:
# 1. Share the sheet as "Anyone with the link can view". The export URL
#    built from the sheet id then works, and this job needs nothing else.
# 2. Publish the schedule tab to the web as CSV, and set the Actions
#    variable SCHEDULE_CSV_URL to that link. The link is public, not a secret.
# 3. Optional: Actions secret GOOGLE_SHEETS_API_KEY. An API key still only
#    reads a sheet that is shared with anyone who has the link. Never commit
#    the key.
#
# If the sheet cannot be read, this job changes nothing.
name: Sync workshop schedule
on:
  schedule:
    - cron: '15 16 * * *'   # 00:15 in Kuala Lumpur, after the nightly roll
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-build
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kuala_Lumpur
      SCHEDULE_CSV_URL: ${{ vars.SCHEDULE_CSV_URL }}
      GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Private price overlay (unannounced prices stay out of the public repo)
        env:
          OVERLAY: ${{ secrets.WORKSHOPS_PRIVATE_JSON }}
        run: |
          if [ -n "$OVERLAY" ]; then mkdir -p data/private && printf '%s' "$OVERLAY" > data/private/workshops-private.json; fi
      - name: Fetch the schedule sheet
        id: sheet
        run: python3 scripts/sync_schedule.py --write
      - name: Rebuild pages from the sheet
        if: steps.sheet.outputs.updated == 'true'
        run: |
          python3 scripts/expand_sessions.py
          python3 scripts/build_site.py
      - name: Commit the schedule
        if: steps.sheet.outputs.updated == 'true'
        run: |
          rm -rf data/private
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git commit -m "Sync workshop schedule $(date +%F)"
          git pull --rebase
          git push
